# MA Graded Entry Strategy / 均线分级买点
# Multi-grade buy signals based on MA5/MA20 alignment for both market index and individual stocks.

name: ma_graded_entry
display_name: 均线分级买点
description: 结合大盘与个股 MA5/MA20 位置、斜率、乖离率，分三档买点进场，配双档卖点出场。
category: trend
core_rules: [1, 2, 4]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [分级买点, 均线分级, 超稳健买点, 稳健买点, 回踩买点, 回踩不破]
