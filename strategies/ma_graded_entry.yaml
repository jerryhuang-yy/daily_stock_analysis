instructions: |
  **均线分级买点策略（MA Graded Entry）**

  通过大盘与个股的均线位置、方向、乖离率三重条件筛选买点，分三档风险等级进场；
  卖点以大盘与个股均线信号联动确认。

  ## 数据准备

  使用 `get_daily_history` 获取大盘指数（沪指/深指）与个股近 60 日日线数据，计算：
  - MA5、MA20 及斜率方向（上行 = 近 3 日均线值持续递增）
  - 5日乖离率 = (当前价 - MA5) / MA5 × 100%
  - 20日乖离率 = (当前价 - MA20) / MA20 × 100%

  ## 买点判断（三档）

  ### 买点1 — 超稳健
  **大盘（全部满足）：**
  - 价格 > MA20
  - MA20 上行
  - 价格 > MA5
  - 大盘5日乖离率 < 2%

  **个股（全部满足）：**
  - MA20 上行
  - 价格 > MA20
  - 个股5日乖离率 < 2%
  - 价格向上突破 MA5（当日收盘 > MA5，前日收盘 ≤ MA5）

  信号强度最强，大盘与个股双重多头趋势确认，优先使用。

  ### 买点2 — 稳健
  **大盘（全部满足）：**
  - 价格 > MA20
  - MA20 上行
  - 价格 > MA5
  - 大盘5日乖离率 < 2%

  **个股（全部满足）：**
  - 个股5日乖离率 < 2%
  - 价格向上突破 MA5

  > 放开个股 MA20 上行与价格高于 MA20 的要求，适合个股均线尚未完全多头但大盘环境健康的情形。

  ### 买点3 — 回踩不破
  **大盘（全部满足）：**
  - MA5 上行
  - 价格 > MA5

  **个股（全部满足）：**
  - 前一日20日乖离率 < 1%（前日价格贴近 MA20，回踩充分）
  - 今日 MA5 拐头向上（近 2 日 MA5 斜率由负转正或由平转升）

  > 大盘要求降低至5日线，适用于大盘回调但尚未跌破5日线的环境；个股以回踩 MA20 作为低位买点。

  ## 卖点判断（两档）

  ### 卖点1 — 主动止盈
  **触发条件（同时满足）：**
  - 大盘价格 > MA5（大盘仍强）
  - 个股 MA5 拐头向下（近 2 日 MA5 斜率由正转负）

  操作：个股走弱先行减仓，大盘未破5日线时可部分留仓观察。

  ### 卖点2 — 止损出场
  **触发条件（同时满足）：**
  - 大盘价格 < MA5（大盘也走弱）
  - 个股收盘价跌破 MA5

  操作：大盘与个股双重走弱，清仓止损。

  ## 评分调整建议

  - 满足买点1（超稳健）：`sentiment_score +15`
  - 满足买点2（稳健）：`sentiment_score +10`
  - 满足买点3（回踩不破）：`sentiment_score +8`
  - 触发卖点1（主动止盈）：`sentiment_score -10`
  - 触发卖点2（止损出场）：`sentiment_score -15`
  - 大盘跌破 MA20（额外叠加）：`sentiment_score -8`

  ## 输出要求

  - 明确当前触发的是哪档买点或卖点（或无信号）
  - 给出大盘与个股当前 MA5/MA20 数值、斜率方向及乖离率
  - 说明操作建议：买入 / 减仓 / 止损 / 观望
  - 注明判断信心（高/中/低），低信心时说明原因
